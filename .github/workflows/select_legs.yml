name: Select Legs

on:
  workflow_call:
    inputs:
      full:
        description: "Run all legs with all checks regardless of the event."
        type: boolean
        default: false
    outputs:
      zserio:
        value: ${{jobs.select.outputs.zserio}}
      cpp:
        value: ${{jobs.select.outputs.cpp}}
      java:
        value: ${{jobs.select.outputs.java}}
      python:
        value: ${{jobs.select.outputs.python}}
      doc:
        value: ${{jobs.select.outputs.doc}}
      xml:
        value: ${{jobs.select.outputs.xml}}
      full:
        value: ${{jobs.select.outputs.full}}

# Pull requests and pushes to '*-ci' branches run only the legs their changed paths can affect,
# all other events (pushes to master and release/**, manual runs) run all legs.
#
# 'full' is true for pushes to master and release/** and for manual runs, which run every leg of each language.
# Otherwise it is false and the language workflows run a smoke run: one Linux leg per language, without
# Windows and without the extra and slow checks, a miss shows up on the next push to release/**.
# The 'full' input selects all legs with 'full' true for any event, the release workflow uses it.
jobs:
  select:
    runs-on: "ubuntu-22.04"
    outputs:
      zserio: ${{steps.select.outputs.zserio}}
      cpp: ${{steps.select.outputs.cpp}}
      java: ${{steps.select.outputs.java}}
      python: ${{steps.select.outputs.python}}
      doc: ${{steps.select.outputs.doc}}
      xml: ${{steps.select.outputs.xml}}
      full: ${{steps.select.outputs.full}}

    steps:
    - name: "Checkout"
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: "Test leg selection"
      run: |
        .github/scripts/test_select_legs.sh

    - name: "Select legs"
      id: select
      env:
        EVENT_NAME: ${{github.event_name}}
        REF_NAME: ${{github.ref_name}}
        FULL_INPUT: ${{inputs.full}}
        PULL_REQUEST_BASE_SHA: ${{github.event.pull_request.base.sha}}
        PUSH_BEFORE_SHA: ${{github.event.before}}
      run: |
        BASE_SHA=""
        if [[ "${EVENT_NAME}" == "pull_request" ]] ; then
            BASE_SHA="${PULL_REQUEST_BASE_SHA}"
        elif [[ "${EVENT_NAME}" == "push" && "${REF_NAME}" == *-ci ]] ; then
            BASE_SHA="${PUSH_BEFORE_SHA}"
        fi

        # a new branch has an all zero 'before' and a force push can make it unreachable: run all legs
        if [[ "${FULL_INPUT}" != "true" && -n "${BASE_SHA}" && ! "${BASE_SHA}" =~ ^0+$ ]] &&
                CHANGED_PATHS="$(git diff --name-only "${BASE_SHA}" "${GITHUB_SHA}")" ; then
            echo "Changed paths since ${BASE_SHA}:"
            echo "${CHANGED_PATHS}"
            SELECTION="$(echo "${CHANGED_PATHS}" | .github/scripts/select_legs.sh)"
        else
            echo "Running all legs for ${EVENT_NAME} on ${REF_NAME}."
            SELECTION="$(printf "%s=true\n" zserio cpp java python doc xml)"
        fi

        FULL=false
        if [[ "${FULL_INPUT}" == "true" || "${EVENT_NAME}" == "workflow_dispatch" ||
              ( "${EVENT_NAME}" == "push" && ( "${REF_NAME}" == "master" || "${REF_NAME}" == release/* ) ) ]] ; then
            FULL=true
        fi
        SELECTION="${SELECTION}"$'\n'"full=${FULL}"

        echo "Selected legs:"
        echo "${SELECTION}"
        echo "${SELECTION}" >> "${GITHUB_OUTPUT}"
